name: Build Sonic Mania 3DS CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 3DS ELF
        run: |
          make PLATFORM=3DS

            - name: Find build output
        run: |
          echo "Bin folders:"
          find . -maxdepth 4 -type d -name "bin"

          echo "All RSDK files:"
          find . -name "RSDK*"

          echo "All files in output folders:"
          find . -path "*bin*" -type f
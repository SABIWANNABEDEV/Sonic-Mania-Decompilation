name: Build Sonic Mania 3DS CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 3DS
        run: |
          make PLATFORM=3DS

      - name: Find Build Outputs
        run: |
          echo "Finding ELF files:"
          find . -name "*.elf"

          echo "Finding SO files:"
          find . -name "*.so"

          echo "Finding 3DS folder:"
          find bin/3DS -type f

      - name: Prepare CIA Tools
        run: |
          cd 3ds
          chmod +x makerom
          chmod +x bannertool
          chmod +x build_cia.sh
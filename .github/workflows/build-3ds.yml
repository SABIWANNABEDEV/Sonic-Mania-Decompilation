- name: Build
  run: |
    # whatever your existing build commands are here


- name: Check makerom
  run: |
    echo "=== makerom help ==="
    ./3ds/makerom -h || true

    echo "=== RSF files in repo ==="
    find . -name "*.rsf"


- name: Make CIA
  run: |
    mkdir -p output

    ./3ds/makerom \
      -f cia \
      -o output/SonicMania.cia \
      -elf bin/3DS/SonicMania.so \
      -rsf 3ds/SonicMania.rsf
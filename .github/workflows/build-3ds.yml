name: Build Sonic Mania 3DS CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 3DS ELF
        run: |
          make PLATFORM=3DS

      - name: List 3DS files
        run: |
          find . -maxdepth 3 -type d
          find . -maxdepth 3 -type f | grep -i "3ds"
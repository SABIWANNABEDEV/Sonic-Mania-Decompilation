      - name: Install devkitPro tools
        run: |
          sudo apt update
          sudo apt install -y wget gnupg ca-certificates

          wget https://github.com/devkitPro/pacman/releases/download/v6.0.2/devkitpro-pacman.deb

          sudo apt install -y ./devkitpro-pacman.deb

          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev 3ds-tools
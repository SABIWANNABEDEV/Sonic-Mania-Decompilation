name: Build Sonic Mania 3DS CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Makefile
        run: |
          echo "Searching Makefiles:"
          find . -name "Makefile"

          echo "Searching for 3DS settings:"
          grep -R "3DS" -n . || true

          echo "Searching for TARGET settings:"
          grep -R "TARGET" -n . || true

          echo "Searching for OUTPUT settings:"
          grep -R "OUTPUT" -n . || true

      - name: Build 3DS
        run: |
          make PLATFORM=3DS

      - name: Check outputs
        run: |
          echo "3DS output files:"
          find bin/3DS -type f

          echo "All ELF files:"
          find . -name "*.elf"

          echo "All SO files:"
          find . -name "*.so"
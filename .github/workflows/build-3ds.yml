name: Build Sonic Mania 3DS CIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 3DS
        run: |
          make PLATFORM=3DS

      - name: Build CIA
        run: |
          cd 3ds
          chmod +x makerom
          chmod +x build_cia.sh
          ./build_cia.sh ../bin/3DS/SonicMania.so

      - name: Find CIA output
        run: |
          echo "CIA files:"
          find . -name "*.cia"

          echo "3DS folder contents:"
          find 3ds -maxdepth 3 -type f